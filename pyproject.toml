[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paint-sim"
version = "1.1.0"
description = "2D Plastic-Model Paint & Finish Simulator (Kubelka-Munk + Intrinsic Gloss + Specialty Coatings + Vertex AI Nano Banana)"
readme = "docs/PRD.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["python/tests"]
